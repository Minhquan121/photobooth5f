<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Photobooth - Thanh Xuân 2026</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:#111;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.header{flex:none;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:16px;letter-spacing:.5px}
.pill{background:#222;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px;position:relative}
.preview{position:relative;overflow:hidden;border-radius:18px;background:#000;box-shadow:0 0 0 3px var(--accent,#ff4da6)}
.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center;pointer-events:none}
.preview img.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:800;
  text-shadow:0 4px 20px #000a;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.9;transition:none}
.badge{position:absolute;top:10px;left:10px;background:#000a;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.thumbs{position:absolute;bottom:10px;left:10px;display:flex;gap:6px}
.thumbs canvas{width:38px;height:38px;object-fit:cover;border-radius:8px;border:2px solid #fff;background:#333}
.lens{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#0008;border-radius:999px;padding:4px}
.lens button{min-width:40px;height:40px;border-radius:999px;background:transparent;font-size:13px;font-weight:700}
.lens button.on{background:#fff;color:#000}
.controls{flex:none;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{background:#222;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent,#ff4da6);color:#fff}
.seg .lbl{align-self:center;font-size:12px;opacity:.6;margin-right:2px}
.frames{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frames::-webkit-scrollbar{display:none}
.fr{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;padding:0;width:62px}
.fr canvas{width:62px;height:78px;border-radius:10px;object-fit:contain;background:#222;outline:2px solid transparent;outline-offset:1px}
.fr.on canvas{outline-color:#fff}
.fr span{font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.shootRow{display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.round{width:52px;height:52px;border-radius:50%;background:#222;font-size:22px;display:flex;align-items:center;justify-content:center}
#shutter{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #111,0 0 0 7px #fff;transition:transform .1s}
#shutter:active{transform:scale(.92)}
#shutter:disabled{opacity:.5}
/* result */
#result{display:none;position:fixed;inset:0;z-index:10;background:#111;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#result.show{display:flex}
#result .rstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
#resultCanvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:10px;box-shadow:0 6px 30px #0008;pointer-events:none}
#result .controls{max-width:520px;width:100%;margin:0 auto}
.btns{display:flex;gap:10px;justify-content:center}
.btns button{flex:1;max-width:200px;border-radius:999px;padding:13px 16px;font-weight:700;background:#222}
.btns .primary{background:var(--accent,#ff4da6)}
.beauty .lbl{min-width:0}
.beauty button.cmp{background:#333}
.beauty.busy .lbl{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90%;text-align:center}
/* key gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(120% 80% at 50% 0%,#3a0f2a 0%,#111 60%)}
#gate.hide{display:none}
.gbox{width:100%;max-width:380px;background:#1b1b1b;border-radius:22px;padding:26px 22px;box-shadow:0 0 0 1px #2a2a2a,0 20px 60px #000a;text-align:center}
.gbox h2{margin:6px 0 4px;font-size:20px}
.gbox p{margin:0 0 18px;font-size:13px;opacity:.7;line-height:1.5}
.gbox .ic{font-size:44px}
#keyInput{width:100%;background:#0d0d0d;border:1.5px solid #333;border-radius:14px;color:#fff;padding:14px;font:600 17px ui-monospace,Menlo,monospace;
  text-align:center;letter-spacing:1px;text-transform:uppercase;outline:none;-webkit-user-select:text;user-select:text}
#keyInput:focus{border-color:var(--accent,#ff4da6)}
#keyBtn{margin-top:12px;width:100%;border-radius:14px;padding:14px;font-weight:700;background:var(--accent,#ff4da6)}
#keyBtn:disabled{opacity:.6}
#keyMsg{min-height:20px;margin-top:12px;font-size:13px;color:#ff7a9c}
</style>
</head>
<body>
<div id="gate">
  <form class="gbox" id="gateForm" autocomplete="off">
    <div class="ic">🔑</div>
    <h2>Nhập key kích hoạt</h2>
    <p>Liên hệ admin để nhận key sử dụng Photobooth.</p>
    <input id="keyInput" placeholder="PB-XXXX-XXXX-XXXX" maxlength="40" spellcheck="false" autocapitalize="characters">
    <button id="keyBtn" type="submit">Kích hoạt</button>
    <div id="keyMsg"></div>
  </form>
</div>
<div class="app" id="app">
  <div class="header">
    <b>📸 THANH XUÂN 2026</b>
    <span style="display:flex;gap:6px;align-items:center"><span class="pill" id="keyLeft" title="Thời hạn key" hidden></span><span class="pill" id="frameName">Khung</span></span>
  </div>
  <div class="stage" id="stage">
    <div class="preview" id="preview">
      <video id="video" autoplay playsinline muted webkit-playsinline></video>
      <img class="ov" id="overlay" alt="" hidden>
      <div class="badge" id="badge" hidden></div>
      <div class="thumbs" id="thumbs"></div>
      <div class="lens" id="lens"></div>
      <div class="count" id="count"></div>
      <div class="flash" id="flash"></div>
    </div>
  </div>
  <div class="controls">
    <div class="seg" id="shotsSeg"><span class="lbl">Số ảnh</span></div>
    <div class="seg" id="timerSeg"><span class="lbl">Hẹn giờ</span></div>
    <div class="frames" id="frames"></div>
    <div class="shootRow">
      <button class="round" id="galleryHint" aria-label="Khung tiếp theo">🎀</button>
      <button id="shutter" aria-label="Chụp"></button>
      <button class="round" id="switchBtn" aria-label="Đổi camera">🔄</button>
    </div>
  </div>
</div>

<div id="result">
  <div class="rstage"><canvas id="resultCanvas"></canvas></div>
  <div class="controls">
    <div class="seg beauty" id="beautySeg"><span class="lbl" id="beautyLbl">✨ Làm đẹp AI</span></div>
    <div class="frames" id="frames2"></div>
    <div class="btns">
      <button id="retakeBtn">Chụp lại</button>
      <button class="primary" id="saveBtn">Lưu ảnh</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================== LAYOUTS ================== */
// Mỗi bố cục: kích thước canvas + vị trí các ô ảnh. Khung xem trước dùng đúng tỉ lệ ô ảnh
// nên ảnh chụp ra giống hệt những gì thấy trên màn hình (không bị phóng to).
const LAYOUTS = {
  1:{w:1080,h:1440,slots:[[70,70,940,1110]],text:[540,1320]},
  // 2 và 3 ảnh: dải ảnh dọc, mỗi ô ảnh dọc tỉ lệ 3:4 (giống chụp 1 ảnh / 4 ảnh)
  2:{w:1080,h:2460,slots:[[150,70,780,1040],[150,1170,780,1040]],text:[540,2330]},
  3:{w:1080,h:3080,slots:[[210,70,660,880],[210,1010,660,880],[210,1950,660,880]],text:[540,2950]},
  4:{w:1080,h:1500,slots:[[60,60,460,580],[560,60,460,580],[60,680,460,580],[560,680,460,580]],text:[540,1390]},
};

/* ================== FRAMES ================== */
const overlayImg = new Image();
overlayImg.src = 'frames/thanh_xuan_2026.png';
overlayImg.onload = ()=>{ fitPreview(); renderFramePickers(); if(resultEl.classList.contains('show')) renderResult(); };

const rnd = seed => ()=>{ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; };

function grad(ctx,w,h,stops,diag){
  const g = diag? ctx.createLinearGradient(0,0,w,h) : ctx.createLinearGradient(0,0,0,h);
  stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
}
function dots(ctx,w,h,color,step,r){
  ctx.fillStyle=color;
  for(let y=step/2;y<h;y+=step)for(let x=(y/step)%2?step/2:step;x<w;x+=step){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
}
function stripes(ctx,w,h,color,size){
  ctx.save();ctx.fillStyle=color;
  for(let x=-h;x<w;x+=size*2){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+size,0);ctx.lineTo(x+size+h,h);ctx.lineTo(x+h,h);ctx.fill();}
  ctx.restore();
}
function checker(ctx,w,h,color,s){
  ctx.fillStyle=color;
  for(let y=0;y<h;y+=s)for(let x=((y/s)%2)*s;x<w;x+=s*2)ctx.fillRect(x,y,s,s);
}
function emoji(ctx,ch,x,y,size,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,0);ctx.restore();
}
// Rải sticker quanh viền (tránh che giữa ô ảnh)
function scatter(ctx,L,list,n,seed,size=[60,100]){
  const r=rnd(seed);
  const spots=[];
  L.slots.forEach(([x,y,w,h])=>{
    spots.push([x,y],[x+w,y],[x,y+h],[x+w,y+h]);
  });
  spots.forEach((p,i)=>{
    const ch=list[i%list.length];
    emoji(ctx,ch,p[0]+(r()-.5)*30,p[1]+(r()-.5)*30,size[0]+r()*(size[1]-size[0]),(r()-.5)*.8);
  });
  for(let i=0;i<n;i++){
    const ch=list[Math.floor(r()*list.length)];
    const [tx,ty]=L.text;
    const x = r()<.5 ? 60+r()*(tx-300) : tx+240+r()*(L.w-tx-300);
    const y = ty+(r()-.5)*90;
    emoji(ctx,ch,x,y,size[0]*.8+r()*30,(r()-.5)*.6);
  }
}
function title(ctx,L,text,opt={}){
  const [x,y]=L.text;
  ctx.save();
  ctx.font=`${opt.weight||800} ${opt.size||78}px ${opt.font||'"Avenir Next","Trebuchet MS",-apple-system,sans-serif'}`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(opt.stroke){ctx.lineJoin='round';ctx.lineWidth=opt.strokeW||14;ctx.strokeStyle=opt.stroke;ctx.strokeText(text,x,y);}
  ctx.fillStyle=opt.color||'#fff';ctx.fillText(text,x,y);
  if(opt.sub){ctx.font=`600 ${Math.round((opt.size||78)*.42)}px -apple-system,sans-serif`;ctx.globalAlpha=.85;
    ctx.fillStyle=opt.subColor||opt.color||'#fff';ctx.fillText(opt.sub,x,y+(opt.size||78)*.78);}
  ctx.restore();
}
const today = ()=>{const d=new Date();return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;};

// Mỗi khung: bg (vẽ nền), slotStyle (viền ô), deco (trang trí trên cùng)
const FRAMES = [
  { id:'thanhxuan', name:'Thanh Xuân', accent:'#ff3fb4',
    bg:(c,L)=>{grad(c,L.w,L.h,['#ff5cc8','#ff2aa8']);},
    slot:{border:'#fff',bw:8,radius:24},
    deco:(c,L,n)=>{ if(overlayImg.complete&&overlayImg.naturalWidth) c.drawImage(overlayImg,0,0,L.w,L.h);
    },
    single:true },
  { id:'tet', name:'Tết 🧧', accent:'#e0201b',
    bg:(c,L)=>{grad(c,L.w,L.h,['#d81414','#a80a0a']);c.globalAlpha=.12;dots(c,L.w,L.h,'#ffd54a',70,12);c.globalAlpha=1;
      c.strokeStyle='#ffd54a';c.lineWidth=10;c.strokeRect(22,22,L.w-44,L.h-44);c.lineWidth=3;c.strokeRect(36,36,L.w-72,L.h-72);},
    slot:{border:'#ffd54a',bw:10,radius:14},
    deco:(c,L)=>{scatter(c,L,['🧧','🌸','🏮','🍊','🌼','🧨'],6,11,[70,105]);
      title(c,L,'Chúc Mừng Năm Mới',{size:76,color:'#ffd54a',stroke:'#7a0000',sub:'Xuân Bính Ngọ 2026 🐴'});} },
  { id:'mai', name:'Hoa Mai', accent:'#f4b400',
    bg:(c,L)=>{grad(c,L.w,L.h,['#fff3c4','#ffd36b']);c.globalAlpha=.25;dots(c,L.w,L.h,'#ff9f1c',90,8);c.globalAlpha=1;},
    slot:{border:'#c0392b',bw:8,radius:30},
    deco:(c,L)=>{scatter(c,L,['🌼','🌸','🧧','🐴','✨'],6,23,[70,100]);
      title(c,L,'An Khang Thịnh Vượng',{size:70,color:'#c0392b',stroke:'#fff',sub:'Tết 2026 • '+today(),subColor:'#8a2a1f'});} },
  { id:'noel', name:'Noel 🎄', accent:'#1f8a4c',
    bg:(c,L)=>{grad(c,L.w,L.h,['#1b6e3c','#0f4a27']);const r=rnd(5);c.fillStyle='#fff';
      for(let i=0;i<140;i++){c.globalAlpha=.4+r()*.6;c.beginPath();c.arc(r()*L.w,r()*L.h,2+r()*6,0,7);c.fill();}c.globalAlpha=1;
      c.fillStyle='#d62828';for(let x=0;x<L.w;x+=60){c.fillRect(x,0,30,18);c.fillRect(x+30,L.h-18,30,18);} },
    slot:{border:'#fff',bw:10,radius:20},
    deco:(c,L)=>{scatter(c,L,['🎄','⛄','🎁','❄️','🦌','🔔','🎅'],6,37,[70,105]);
      title(c,L,'Merry Christmas',{size:84,color:'#fff',stroke:'#d62828',font:'"Snell Roundhand","Brush Script MT",cursive',weight:700,sub:'Giáng sinh an lành • '+today()});} },
  { id:'snow', name:'Tuyết Xanh', accent:'#5aa9e6',
    bg:(c,L)=>{grad(c,L.w,L.h,['#cfe8ff','#8ec5ff']);const r=rnd(9);for(let i=0;i<40;i++)emoji(c,'❄️',r()*L.w,r()*L.h,20+r()*30);},
    slot:{border:'#fff',bw:12,radius:30},
    deco:(c,L)=>{scatter(c,L,['☃️','❄️','🧣','🎁','⭐'],4,41,[65,95]);
      title(c,L,'Winter Wonderland',{size:74,color:'#fff',stroke:'#3b7fc4',sub:today(),subColor:'#1d4f86'});} },
  { id:'strawberry', name:'Dâu Tây', accent:'#ff5d73',
    bg:(c,L)=>{c.fillStyle='#fff0f3';c.fillRect(0,0,L.w,L.h);checker(c,L.w,L.h,'#ffd1da',60);},
    slot:{border:'#ff5d73',bw:10,radius:28},
    deco:(c,L)=>{scatter(c,L,['🍓','🎀','💗','🍰','🌷'],6,53,[65,95]);
      title(c,L,'Sweet Day',{size:88,color:'#ff5d73',stroke:'#fff',sub:'♡ '+today()+' ♡',subColor:'#d6455a'});} },
  { id:'bear', name:'Gấu Nâu', accent:'#b7804e',
    bg:(c,L)=>{c.fillStyle='#f6e7d3';c.fillRect(0,0,L.w,L.h);c.globalAlpha=.5;dots(c,L.w,L.h,'#e3c49f',64,10);c.globalAlpha=1;},
    slot:{border:'#8b5a2b',bw:8,radius:40},
    deco:(c,L)=>{scatter(c,L,['🧸','🍪','☕','🤎','🐻'],5,61,[65,95]);
      title(c,L,'Cozy Day',{size:88,color:'#8b5a2b',stroke:'#fff',sub:today()});} },
  { id:'sky', name:'Mây Trời', accent:'#7cc6fe',
    bg:(c,L)=>{grad(c,L.w,L.h,['#bfe3ff','#fde2ff']);const r=rnd(71);for(let i=0;i<14;i++)emoji(c,'☁️',r()*L.w,r()*L.h,60+r()*60);},
    slot:{border:'#fff',bw:14,radius:34},
    deco:(c,L)=>{scatter(c,L,['🌈','☁️','⭐','🦋','💫'],5,73,[65,95]);
      title(c,L,'Happy Everyday',{size:80,color:'#6a8dff',stroke:'#fff',sub:today()});} },
  { id:'film', name:'Film Đen', accent:'#444',
    bg:(c,L)=>{c.fillStyle='#141414';c.fillRect(0,0,L.w,L.h);c.fillStyle='#f2f2f2';
      for(let y=20;y<L.h;y+=56){c.fillRect(14,y,26,34);c.fillRect(L.w-40,y,26,34);} },
    slot:{border:'#000',bw:0,radius:4},
    deco:(c,L)=>{title(c,L,'PHOTOBOOTH',{size:70,color:'#fff',weight:900,sub:'★ '+today()+' ★'});} },
  { id:'polaroid', name:'Polaroid', accent:'#999',
    bg:(c,L)=>{c.fillStyle='#fbfaf6';c.fillRect(0,0,L.w,L.h);},
    slot:{border:'#e6e2d8',bw:2,radius:2,shadow:true},
    deco:(c,L)=>{title(c,L,'good times ♡',{size:76,color:'#333',font:'"Marker Felt","Comic Sans MS",cursive',weight:500,sub:today(),subColor:'#777'});} },
  { id:'lavender', name:'Lavender', accent:'#a78bfa',
    bg:(c,L)=>{grad(c,L.w,L.h,['#efe5ff','#d6c2ff'],true);c.globalAlpha=.35;stripes(c,L.w,L.h,'#fff',40);c.globalAlpha=1;},
    slot:{border:'#fff',bw:12,radius:26},
    deco:(c,L)=>{scatter(c,L,['💜','🦄','✨','🪻','🌙'],5,83,[65,95]);
      title(c,L,'Dreamy',{size:92,color:'#7c5cff',stroke:'#fff',sub:today(),subColor:'#5b40c9'});} },
  { id:'love', name:'Tình Yêu', accent:'#ff2e63',
    bg:(c,L)=>{grad(c,L.w,L.h,['#ff8fab','#ff4d6d']);const r=rnd(91);c.globalAlpha=.35;for(let i=0;i<30;i++)emoji(c,'💗',r()*L.w,r()*L.h,30+r()*40,(r()-.5));c.globalAlpha=1;},
    slot:{border:'#fff',bw:10,radius:24},
    deco:(c,L)=>{scatter(c,L,['💖','💌','🌹','💕','💘'],6,97,[65,95]);
      title(c,L,'Love You ♡',{size:90,color:'#fff',stroke:'#c9184a',sub:today()});} },
  { id:'summer', name:'Mùa Hè', accent:'#ffb703',
    bg:(c,L)=>{grad(c,L.w,L.h,['#8ee3f5','#ffe29a']);},
    slot:{border:'#fff',bw:10,radius:24},
    deco:(c,L)=>{scatter(c,L,['🌴','🍉','🌞','🐚','🍹','🌺'],6,103,[65,100]);
      title(c,L,'Summer Vibes',{size:84,color:'#fb8500',stroke:'#fff',sub:today(),subColor:'#d36b00'});} },
  { id:'mint', name:'Bạc Hà', accent:'#2ec4b6',
    bg:(c,L)=>{c.fillStyle='#dcfff7';c.fillRect(0,0,L.w,L.h);c.globalAlpha=.5;dots(c,L.w,L.h,'#a8f0e2',50,9);c.globalAlpha=1;},
    slot:{border:'#2ec4b6',bw:8,radius:30},
    deco:(c,L)=>{scatter(c,L,['🍀','🐸','🌿','🍃','🫧'],5,109,[65,95]);
      title(c,L,'Fresh Mood',{size:86,color:'#159a8c',stroke:'#fff',sub:today()});} },
  { id:'birthday', name:'Sinh Nhật', accent:'#f72585',

      for(let i=0;i<220;i++){c.fillStyle=cols[i%5];c.save();c.translate(r()*L.w,r()*L.h);c.rotate(r()*3);c.fillRect(-8,-4,16,8);c.restore();}},

function roundRect(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}

// Vẽ toàn bộ ảnh: photos = mảng canvas (đã cắt đúng tỉ lệ ô), null = ô trống (dùng cho ảnh mẫu)
function compose(canvas,frame,n,photos){
  const L=layoutFor(frame,n);
  canvas.width=L.w;canvas.height=L.h;
  const c=canvas.getContext('2d');
  c.clearRect(0,0,L.w,L.h);
  if(L.full){ // khung PNG 1 ảnh: ảnh phủ toàn bộ, khung đè lên trên
    if(photos[0]) c.drawImage(photos[0],0,0,L.w,L.h); else {grad(c,L.w,L.h,['#777','#444']);}
    if(overlayImg.complete&&overlayImg.naturalWidth) c.drawImage(overlayImg,0,0,L.w,L.h);
    return;
  }
  frame.bg(c,L);
  const s=frame.slot;
  L.slots.forEach(([x,y,w,h],i)=>{
    c.save();
    if(s.shadow){c.shadowColor='#0004';c.shadowBlur=24;c.shadowOffsetY=8;}
    if(s.bw){c.fillStyle=s.border;roundRect(c,x-s.bw,y-s.bw,w+s.bw*2,h+s.bw*2,s.radius+s.bw);c.fill();}
    c.restore();
    c.save();roundRect(c,x,y,w,h,s.radius);c.clip();
    if(photos[i]) c.drawImage(photos[i],x,y,w,h);
    else{c.fillStyle='#0003';c.fillRect(x,y,w,h);c.fillStyle='#fff8';c.font=`700 ${Math.min(w,h)*.3}px -apple-system,sans-serif`;
      c.textAlign='center';c.textBaseline='middle';c.fillText(String(i+1),x+w/2,y+h/2);}
    c.restore();
  });
  frame.deco(c,L,n);
}
function layoutFor(frame,n){
  if(frame.single && n===1 && overlayImg.naturalWidth){
    const w=1080,h=Math.round(1080*overlayImg.naturalHeight/overlayImg.naturalWidth);
    return {w,h,slots:[[0,0,w,h]],text:[w/2,h-100],full:true};
  }
  return LAYOUTS[n];
}

let stream=null, track=null, backCams={}; // backCams: {'0.5x':deviceId,'1x':deviceId,'tele':deviceId}
function classify(label){
  const l=label.toLowerCase();
  if(/front|trước|user|facetime/.test(l)) return 'front';
  if(/dual|triple|kép|bộ ba|camera ba\b/.test(l)) return 'virtual';
  if(/ultra|siêu rộng|0\.5|ultrawide/.test(l)) return '0.5x';
  if(/tele/.test(l)) return 'tele';
  if(/back|sau|rear|environment/.test(l)) return '1x';
  return 'unknown';
}
async function scanDevices(){
  try{
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    backCams={};
    devs.forEach(d=>{const k=classify(d.label||'');if(['0.5x','1x','tele'].includes(k)&&!backCams[k])backCams[k]=d.deviceId;});
  }catch(e){}
}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;}
async function startCam(){
  stopCam();
  const base={width:{ideal:1920},height:{ideal:1440}};
  let constraints;
  if(state.facing==='environment' && backCams[state.lens]) constraints={deviceId:{exact:backCams[state.lens]},...base};
  else if(state.facing==='environment' && backCams['1x'] ) constraints={deviceId:{exact:backCams['1x']},...base};
  else constraints={facingMode:state.facing,...base};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:constraints,audio:false});
  }catch(e){
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing},audio:false});}
    catch(e2){toast('Không mở được camera: '+e2.message+'. Hãy mở bằng HTTPS và cho phép camera.',5000);return;}
  }
  track=stream.getVideoTracks()[0];
  video.srcObject=stream;
  try{await video.play();}catch(e){}
  if(!Object.keys(backCams).length){await scanDevices(); }
  await applyLens(false);
  buildLensUI();
}
function zoomCaps(){try{const c=track&&track.getCapabilities&&track.getCapabilities();return c&&c.zoom?c.zoom:null;}catch(e){return null;}}
// Các ống kính có thể dùng
function availableLenses(){
  if(state.facing==='user') return [];
  const z=zoomCaps(), list=[];
  if(backCams['0.5x'] || (z&&z.min<1)) list.push('0.5x');
  list.push('1x');
  list.push('tele'); // tele thật nếu có, nếu không dùng zoom 2x
  return list;
}
async function applyLens(restart){
  state.digital=1;
  const usingDevice = state.facing==='environment' && backCams[state.lens];
  const z=zoomCaps();
  if(state.facing==='environment' && !usingDevice){
    if(state.lens==='0.5x' && z && z.min<1){try{await track.applyConstraints({advanced:[{zoom:z.min}]});}catch(e){}}
    else if(state.lens==='tele'){
      if(z && z.max>=2){try{await track.applyConstraints({advanced:[{zoom:Math.min(z.max,3)}]});}catch(e){state.digital=2;}}
      else state.digital=2;
    } else if(z){try{await track.applyConstraints({advanced:[{zoom:Math.max(1,z.min)}]});}catch(e){}}
  }
  updateVideoTransform();
}
function updateVideoTransform(){
  const mirror=state.facing==='user'?' scaleX(-1)':'';
  video.style.transform=`scale(${state.digital})`+mirror;
}
function buildLensUI(){
  lensEl.innerHTML='';
  const list=availableLenses();
  if(!list.length){lensEl.hidden=true;return;}
  lensEl.hidden=false;
  if(!list.includes(state.lens)) state.lens='1x';
  list.forEach(k=>{
    const b=document.createElement('button');
    b.textContent=k==='tele'?(backCams.tele?'Tele':'2x'):k==='0.5x'?'.5':'1x';
    b.className=state.lens===k?'on':'';
    b.onclick=async()=>{
      if(state.busy||state.lens===k)return;
      const prev=state.lens;state.lens=k;
      const needRestart = !!(backCams[k]||backCams[prev]) && backCams[k]!==backCams[prev];
      if(needRestart) await startCam(); else {await applyLens();buildLensUI();}
    };
    lensEl.appendChild(b);
  });
}
$('switchBtn').onclick=async()=>{

  startCam();
};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function countdown(sec){

// Chụp đúng phần đang hiển thị trong khung xem trước (object-fit: cover + zoom số)
function grabFrame(){
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return null;
  const L=layoutFor(FRAMES[state.frame],state.shots);const [,,sw0,sh0]=L.slots[0];
  const ratio=sw0/sh0;
  let sw,sh;
  if(vw/vh>ratio){sh=vh;sw=sh*ratio;}else{sw=vw;sh=sw/ratio;}
  sw/=state.digital;sh/=state.digital;
  const sx=(vw-sw)/2,sy=(vh-sh)/2;
  const outW=Math.min(Math.round(sw),1600),outH=Math.round(outW/ratio);
  const cv=document.createElement('canvas');cv.width=outW;cv.height=outH;
  const c=cv.getContext('2d');
  if(state.facing==='user'){c.translate(outW,0);c.scale(-1,1);}
  c.drawImage(video,sx,sy,sw,sh,0,0,outW,outH);
  return cv;
}
function addThumb(cv){const t=document.createElement('canvas');t.width=76;t.height=76;
  const c=t.getContext('2d'),s=Math.max(76/cv.width,76/cv.height);c.drawImage(cv,(76-cv.width*s)/2,(76-cv.height*s)/2,cv.width*s,cv.height*s);thumbs.appendChild(t);}

shutter.onclick=async()=>{

  state.busy=true;shutter.disabled=true;state.photos=[];state.raw=[];state.cache={};state.faces=null;beautyJob++;thumbs.innerHTML='';
  const n=state.shots;
  for(let i=0;i<n;i++){
    if(n>1){badge.hidden=false;badge.textContent=`Ảnh ${i+1}/${n}`;}
    const wait = state.timer || (n>1 && i>0 ? 2 : 0);
    if(wait) await countdown(wait);
    const cv=grabFrame(); if(!cv) break;
    state.photos.push(cv);state.raw.push(cv);
    flashEl.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>flashEl.classList.remove('on')));
    if(n>1) addThumb(cv);
    await sleep(n>1?500:250);
  }
  badge.hidden=true;state.busy=false;shutter.disabled=false;
  if(state.photos.length){showResult();applyBeauty();}
};

/* ================== AI LÀM ĐẸP (giữ nguyên khuôn mặt) ================== */
// AI (MediaPipe Face Landmarker, chạy ngay trên máy) chỉ dùng để XÁC ĐỊNH vùng da mặt.
// Hiệu ứng chỉ làm mịn da + sáng da, KHÔNG kéo/biến dạng/vẽ lại khuôn mặt.
// Mắt, lông mày, môi được loại khỏi vùng làm mịn nên giữ nguyên độ sắc nét.
const BEAUTY_LEVELS=[0,1,2,3], BEAUTY_NAMES=['Tắt','Nhẹ','Vừa','Mạnh'];
const B_AMT=[0,.5,.7,.85], B_SIGMA=[0,14,19,25], B_BRIGHT=[0,.035,.06,.09], B_RAD=[0,.7,1,1.3];
const MP_URL='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const FEATURES=[
  [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246],        // mắt
  [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398],    // mắt
  [70,63,105,66,107,55,65,52,53,46],                                    // lông mày
  [300,293,334,296,336,285,295,282,283,276],                            // lông mày
  [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185], // môi
];
let landmarkerP=null, beautyJob=0;
function loadLandmarker(){
  if(!landmarkerP) landmarkerP=(async()=>{
    const v=await import(MP_URL+'/vision_bundle.mjs');
    const fs=await v.FilesetResolver.forVisionTasks(MP_URL+'/wasm');
    return v.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'CPU'},runningMode:'IMAGE',numFaces:6});
  })().catch(e=>{console.warn('Face AI không tải được',e);landmarkerP=null;return null;});
  return landmarkerP;
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);

// Làm mờ hộp tách lớp (O(n)), dùng 2 lần ≈ Gaussian
function boxBlur(src,w,h,r){
  const tmp=new Float32Array(w*h),out=new Float32Array(w*h),d=2*r+1;
  for(let y=0;y<h;y++){const o=y*w;let a=0;
    for(let x=-r;x<=r;x++)a+=src[o+(x<0?0:x>=w?w-1:x)];
    for(let x=0;x<w;x++){tmp[o+x]=a/d;const xa=x+r+1,xs=x-r;a+=src[o+(xa>=w?w-1:xa)]-src[o+(xs<0?0:xs)];}}
  for(let x=0;x<w;x++){let a=0;
    for(let y=-r;y<=r;y++)a+=tmp[(y<0?0:y>=h?h-1:y)*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=a/d;const ya=y+r+1,ys=y-r;a+=tmp[(ya>=h?h-1:ya)*w+x]-tmp[(ys<0?0:ys)*w+x];}}
  return out;
}
const blur2=(a,w,h,r)=>boxBlur(boxBlur(a,w,h,r),w,h,r);

// Mặt nạ vùng da mặt (0..1) cho vùng rx,ry,rw,rh, có viền mềm
function faceMask(faces,W,H,rx,ry,rw,rh,fw){
  const s=4,mw=Math.max(1,Math.ceil(rw/s)),mh=Math.max(1,Math.ceil(rh/s));
  const m=document.createElement('canvas');m.width=mw;m.height=mh;
  const c=m.getContext('2d',{willReadFrequently:true});
  const path=(f,idx)=>{c.beginPath();idx.forEach((i,j)=>{const x=(f[i].x*W-rx)/s,y=(f[i].y*H-ry)/s;j?c.lineTo(x,y):c.moveTo(x,y);});c.closePath();};
  c.fillStyle=c.strokeStyle='#fff';c.lineJoin='round';
  faces.forEach(f=>{path(f,OVAL);c.fill();});
  c.globalCompositeOperation='destination-out';c.lineWidth=Math.max(2,fw/s*.04);
  faces.forEach(f=>FEATURES.forEach(idx=>{path(f,idx);c.fill();c.stroke();}));
  const id=c.getImageData(0,0,mw,mh),a=new Float32Array(mw*mh);
  for(let i=0;i<a.length;i++)a[i]=id.data[i*4+3];
  const b=blur2(a,mw,mh,Math.max(1,Math.round(fw/s*.035)));
  for(let i=0;i<b.length;i++){const v=b[i];id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
  c.globalCompositeOperation='copy';c.putImageData(id,0,0);
  const big=document.createElement('canvas');big.width=rw;big.height=rh;
  const bc=big.getContext('2d',{willReadFrequently:true});bc.imageSmoothingQuality='high';bc.drawImage(m,0,0,mw,mh,0,0,mw*s,mh*s);
  const bd=bc.getImageData(0,0,rw,rh).data,out=new Float32Array(rw*rh);
  for(let i=0;i<out.length;i++)out[i]=bd[i*4]/255;
  return out;
}

function beautify(src,level,faces){
  const W=src.width,H=src.height;
  const out=document.createElement('canvas');out.width=W;out.height=H;
  const oc=out.getContext('2d',{willReadFrequently:true});oc.drawImage(src,0,0);
  if(!level) return out;
  let rx=0,ry=0,rw=W,rh=H,mask=null,fw=W*.35;
  if(faces&&faces.length){
    let x0=1,y0=1,x1=0,y1=0;fw=0;
    faces.forEach(f=>{let a=1,b=0;OVAL.forEach(i=>{const p=f[i];a=Math.min(a,p.x);b=Math.max(b,p.x);
      x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});fw=Math.max(fw,(b-a)*W);});
    const px=(x1-x0)*.08,py=(y1-y0)*.08;
    rx=Math.max(0,Math.floor((x0-px)*W));ry=Math.max(0,Math.floor((y0-py)*H));
    rw=Math.min(W,Math.ceil((x1+px)*W))-rx;rh=Math.min(H,Math.ceil((y1+py)*H))-ry;
    if(rw<8||rh<8) return out;
    mask=faceMask(faces,W,H,rx,ry,rw,rh,fw);
  }
  const img=oc.getImageData(rx,ry,rw,rh),d=img.data,N=rw*rh;
  const R=new Float32Array(N),G=new Float32Array(N),B=new Float32Array(N);
  for(let i=0,j=0;i<N;i++,j+=4){R[i]=d[j];G[i]=d[j+1];B[i]=d[j+2];}
  const rad=Math.round(Math.min(16,Math.max(2,fw*.018*B_RAD[level])));
  const bR=blur2(R,rw,rh,rad),bG=blur2(G,rw,rh,rad),bB=blur2(B,rw,rh,rad);
  const amt=B_AMT[level]*(mask?1:.7),s2=2*B_SIGMA[level]**2,br=B_BRIGHT[level];
  for(let i=0,j=0;i<N;i++,j+=4){
    const r=R[i],g=G[i],b=B[i];
    // Độ giống màu da (YCbCr) – tránh làm mịn tóc, kính, nền
    const cb=128-.168736*r-.331264*g+.5*b, cr=128+.5*r-.418688*g-.081312*b;
    let sk=1.6-Math.hypot((cb-102)/24,(cr-153)/19);sk=sk<0?0:sk>1?1:sk;
    const m=mask?mask[i]*(.35+.65*sk):sk;
    if(m<.01)continue;
    // Giữ cạnh: chỉ làm mịn chỗ chênh lệch nhỏ (mụn, lỗ chân lông), giữ nét đường viền
    const dr=bR[i]-r,dg=bG[i]-g,db=bB[i]-b;
    const k=m*amt*Math.exp(-(dr*dr+dg*dg+db*db)/(3*s2));
    let nr=r+dr*k,ng=g+dg*k,nb=b+db*k;
    const l=m*br; nr+=(255-nr)*l;ng+=(255-ng)*l*.96;nb+=(255-nb)*l*.94; // sáng da, hơi hồng ấm
    d[j]=nr;d[j+1]=ng;d[j+2]=nb;
  }
  oc.putImageData(img,rx,ry);
  return out;
}

function setBeautyBusy(on){$('beautySeg').classList.toggle('busy',on);$('beautyLbl').textContent=on?'✨ Đang làm đẹp…':'✨ Làm đẹp AI';}
async function applyBeauty(){
  const job=++beautyJob,lvl=state.beauty,raw=state.raw;
  if(!raw.length)return;
  const show=list=>{state.photos=list;renderResult();renderFramePickers();};
  if(!lvl){setBeautyBusy(false);show(raw.slice());return;}
  if(state.cache[lvl]){setBeautyBusy(false);show(state.cache[lvl]);return;}
  setBeautyBusy(true);
  let faces=state.faces;
  if(!faces){
    const lm=await withTimeout(loadLandmarker(),25000);
    if(job!==beautyJob)return;
    if(lm){faces=raw.map(cv=>{try{return lm.detect(cv).faceLandmarks||[];}catch(e){return null;}});state.faces=faces;}
    else faces=raw.map(()=>null);
  }
  const res=[];
  for(let i=0;i<raw.length;i++){
    await sleep(16);if(job!==beautyJob)return;
    res.push(beautify(raw[i],lvl,faces[i]));
  }
  state.cache[lvl]=res;setBeautyBusy(false);show(res);
  if(faces.every(f=>!f)) toast('Chưa tải được AI nhận diện mặt – đã làm mịn da cơ bản');
}
(function buildBeautyUI(){
  const el=$('beautySeg');
  const draw=()=>{[...el.querySelectorAll('button')].forEach(b=>b.remove());
    BEAUTY_LEVELS.forEach(v=>{const b=document.createElement('button');b.textContent=BEAUTY_NAMES[v];b.className=state.beauty===v?'on':'';
      b.onclick=()=>{state.beauty=v;localStorage.pb_beauty=v;draw();applyBeauty();};el.appendChild(b);});
    const cmp=document.createElement('button');cmp.className='cmp';cmp.textContent='👁 Giữ xem gốc';
    const down=e=>{e.preventDefault();if(state.raw.length)compose(resultCanvas,FRAMES[state.frame],state.raw.length,state.raw);};
    const up=()=>{if(state.raw.length)renderResult();};
    cmp.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>cmp.addEventListener(ev,up));
    cmp.oncontextmenu=e=>e.preventDefault();
    el.appendChild(cmp);};
  draw();
})();

/* ================== INIT ================== */
applyFrameUI();
requestAnimationFrame(()=>{fitPreview();renderFramePickers();});
// Chặn cử chỉ phóng to của Safari (pinch / double-tap)
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
/* ================== KEY ================== */
let unlocked=false, keyExp=null, keyTimer=null;
const deviceId=localStorage.pb_device||(localStorage.pb_device=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)));
function fmtLeft(ms){const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  return d?`${d} ngày ${h} giờ`:h?`${h} giờ ${mm} phút`:`${Math.max(mm,0)} phút`;}
function lock(msg){unlocked=false;stopCam();clearInterval(keyTimer);$('gate').classList.remove('hide');$('keyLeft').hidden=true;
  $('keyMsg').textContent=msg||'';}
function tickKey(){const el=$('keyLeft');el.hidden=false;
  if(!keyExp){el.textContent='♾ Vĩnh viễn';return;}
  const left=keyExp-Date.now();if(left<=0){delete localStorage.pb_key;lock('Key đã hết hạn. Vui lòng nhập key mới.');return;}
  el.textContent='⏳ '+fmtLeft(left);}
async function verifyKey(key){
  const r=await fetch('/api/key/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key,deviceId})});
  return r.json();
}
function unlock(res){
  localStorage.pb_key=res.key;keyExp=res.expiresAt?new Date(res.expiresAt).getTime():null;
  $('gate').classList.add('hide');tickKey();clearInterval(keyTimer);keyTimer=setInterval(tickKey,30000);
  if(unlocked)return;unlocked=true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) toast('Trình duyệt không hỗ trợ camera. Hãy mở bằng Safari qua HTTPS.',6000);
  else startCam();
  if(state.beauty) setTimeout(loadLandmarker,2500); // tải trước mô hình AI khi rảnh
}
$('gateForm').onsubmit=async e=>{e.preventDefault();
  const key=$('keyInput').value.trim();if(!key){$('keyMsg').textContent='Vui lòng nhập key';return;}
  $('keyBtn').disabled=true;$('keyBtn').textContent='Đang kiểm tra…';$('keyMsg').textContent='';
  try{const res=await verifyKey(key);if(res.ok)unlock(res);else $('keyMsg').textContent=res.message||'Key không hợp lệ';}
  catch(err){$('keyMsg').textContent='Không kết nối được máy chủ, thử lại sau';}
  $('keyBtn').disabled=false;$('keyBtn').textContent='Kích hoạt';};
async function recheck(){const k=localStorage.pb_key;if(!k){lock();return;}
  try{const res=await verifyKey(k);if(res.ok)unlock(res);else{delete localStorage.pb_key;lock(res.message);}}
  catch(e){if(!unlocked){$('keyInput').value=k;lock('Không kết nối được máy chủ, thử lại sau');}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam();else if(unlocked){startCam();recheck();}});
if(localStorage.pb_key)$('gate').classList.add('hide');
recheck();
</script>
